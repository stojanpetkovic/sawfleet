name: Permit automation

on:
  # Scheduled runs now handled by the pg_cron job "sftreeremoval-permit-sync"
  # inside Supabase itself, so this workflow is kept for manual triggering only.
  workflow_dispatch:

jobs:
  run-permit-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger permit automation endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            --max-time 300 \
            "https://sftreeremoval.com/api/permit-sync"
